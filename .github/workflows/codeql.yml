# EXPERIMENT (issue 213), not for merging: can CodeQL analyze the engine's Swift on the xcode-27 runner?
# It runs only on pushes to this branch, uploads nothing to code scanning, and is replaced before any pull request.
name: CodeQL

on:
  push:
    branches: [issue-213-codeql-xcode-27]

permissions:
  contents: read

concurrency:
  group: codeql-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: Analyze (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: actions
            language: actions
            build-mode: none
            os: ubuntu-latest
          - name: swift autobuild, Xcode 27.1
            language: swift
            build-mode: autobuild
            os: xcode-27
          - name: swift manual, Xcode 27.1
            language: swift
            build-mode: manual
            os: xcode-27
          - name: swift manual, Xcode 27.0
            language: swift
            build-mode: manual
            os: xcode-27
            developer-dir: /Applications/Xcode_27.0.app/Contents/Developer
    env:
      DEVELOPER_DIR: ${{ matrix.developer-dir || '/Applications/Xcode.app/Contents/Developer' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Toolchain
        if: ${{ matrix.language == 'swift' }}
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Initialize CodeQL
        uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Build the engine
        if: ${{ matrix.build-mode == 'manual' }}
        run: |
          scripts/build-check.sh engine

      - name: Analyze
        uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          category: /language:${{ matrix.language }}
          upload: never

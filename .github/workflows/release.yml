# Builds, signs and notarizes a release when a version tag is pushed, then publishes a GitHub release with the DMG and
# its checksum (ENG-007), and the version's notes from CHANGELOG.md (D-95). The owner's control is the release
# environment's approval, before any secret is read (D-174). Setup: docs/releasing.md.
name: Release

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release
    runs-on: xcode-27
    timeout-minutes: 60
    # The signing secrets live in this environment, which only v* tags may use (ENG-008).
    environment: release
    # Permissions are set per job, not per step. Only "Publish the release" receives the token, through GH_TOKEN:
    # checkout keeps no credentials, and no other step names github.token (#125).
    permissions:
      contents: write
    steps:
      # Actions are pinned to full commit SHAs (supply-chain risk, R-13).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the build number counts commits
          persist-credentials: false # the repository is public, so fetching main needs no token

      - name: Check the tag is on main
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME does not point to a commit on main"
            exit 1
          fi

      - name: Static checks
        run: scripts/static-checks.sh

      # Before signing, so a version without notes in CHANGELOG.md fails fast (D-95).
      - name: Release notes
        run: scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > "$RUNNER_TEMP/release-notes.md"

      - name: Import the Developer ID certificate
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 3600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          # Only this user may read the decoded key material (#125).
          umask 077
          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" -P "$CERTIFICATE_PASSWORD" -t cert -f pkcs12 \
            -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')

      - name: Write the App Store Connect API key
        env:
          ASC_KEY_P8_BASE64: ${{ secrets.ASC_KEY_P8_BASE64 }}
        run: |
          umask 077 # only this user may read the key (#125)
          printf '%s' "$ASC_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/AuthKey.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"

      - name: Build, sign and notarize
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: SHUCK_EXPECT_VERSION="${GITHUB_REF_NAME#v}" scripts/build-dmg.sh

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Milestone builds before 1.0.0 are pre-releases (ENG-009).
          prerelease=""
          if [[ "$version" == 0.* ]]; then prerelease="--prerelease"; fi
          # gh uploads the files to a draft first and publishes it only once they are all there.
          gh release create "$GITHUB_REF_NAME" --verify-tag $prerelease \
            --title "Shuck $version" --notes-file "$RUNNER_TEMP/release-notes.md" \
            "build/release/Shuck-$version.dmg" "build/release/Shuck-$version.dmg.sha256"

      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2> /dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/certificate.p12"
